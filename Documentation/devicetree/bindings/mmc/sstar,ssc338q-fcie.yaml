%YAML 1.2
---
$id: http://devicetree.org/schemas/mmc/sstar,ssc338q-fcie.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: SigmaStar SSC338Q FCIE SD host controller

maintainers:
  - Petr Kracik <petrkr@petrkr.net>

description:
  The FCIE (flash card interface engine) of the SigmaStar SSC338Q
  (Infinity6E) SoC is an SD host controller with its own DMA engine.

allOf:
  - $ref: mmc-controller.yaml#

properties:
  compatible:
    const: sstar,ssc338q-fcie

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 1

required:
  - compatible
  - reg
  - interrupts
  - clocks

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/sstar,ssc338q-clkgen.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    mmc@282600 {
        compatible = "sstar,ssc338q-fcie";
        reg = <0x282600 0x100>;
        interrupts = <GIC_SPI 18 IRQ_TYPE_LEVEL_HIGH>;
        clocks = <&clkgen SSC338Q_CLKGEN_SD>;
        bus-width = <4>;
    };
