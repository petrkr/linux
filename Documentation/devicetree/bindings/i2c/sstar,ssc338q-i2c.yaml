%YAML 1.2
---
$id: http://devicetree.org/schemas/i2c/sstar,ssc338q-i2c.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: SigmaStar SSC338Q I2C master

maintainers:
  - Petr Kracik <petrkr@petrkr.net>

description:
  The I2C master controllers (MIIC) of the SigmaStar SSC338Q (Infinity6E)
  SoC.

allOf:
  - $ref: /schemas/i2c/i2c-controller.yaml#

properties:
  compatible:
    const: sstar,ssc338q-i2c

  reg:
    maxItems: 1

  clocks:
    maxItems: 1

  clock-frequency:
    default: 100000

required:
  - compatible
  - reg
  - clocks

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/sstar,ssc338q-clkgen.h>

    i2c@223000 {
        compatible = "sstar,ssc338q-i2c";
        reg = <0x223000 0x200>;
        clocks = <&clkgen SSC338Q_CLKGEN_MIIC0>;
        #address-cells = <1>;
        #size-cells = <0>;
    };
