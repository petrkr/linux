%YAML 1.2
---
$id: http://devicetree.org/schemas/rng/sstar,ssc338q-rng.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: SigmaStar SSC338Q random number generator

maintainers:
  - Petr Kracik <petrkr@petrkr.net>

description:
  Hardware random number generator in the crypto engine (AESDMA) register
  block of the SigmaStar SSC338Q (Infinity6E) SoC.

properties:
  compatible:
    const: sstar,ssc338q-rng

  reg:
    maxItems: 1

  clocks:
    maxItems: 1

required:
  - compatible
  - reg
  - clocks

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/sstar,ssc338q-clkgen.h>

    rng@224400 {
        compatible = "sstar,ssc338q-rng";
        reg = <0x224400 0x10>;
        clocks = <&clkgen SSC338Q_CLKGEN_AESDMA>;
    };
