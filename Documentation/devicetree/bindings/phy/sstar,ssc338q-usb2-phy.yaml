%YAML 1.2
---
$id: http://devicetree.org/schemas/phy/sstar,ssc338q-usb2-phy.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: SigmaStar SSC338Q USB 2.0 PHY

maintainers:
  - Petr Kracik <petrkr@petrkr.net>

description:
  UTMI transceiver of the USB 2.0 host port, with the battery charger
  detection block on its data lines.

properties:
  compatible:
    const: sstar,ssc338q-usb2-phy

  reg:
    items:
      - description: UTMI registers
      - description: Battery charger detection registers

  reg-names:
    items:
      - const: utmi
      - const: bc

  "#phy-cells":
    const: 0

required:
  - compatible
  - reg
  - reg-names
  - "#phy-cells"

additionalProperties: false

examples:
  - |
    phy@284200 {
        compatible = "sstar,ssc338q-usb2-phy";
        reg = <0x284200 0x200>, <0x284400 0x200>;
        reg-names = "utmi", "bc";
        #phy-cells = <0>;
    };
